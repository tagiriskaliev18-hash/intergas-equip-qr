<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>404 — Оборудование не найдено | Mind Equip</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="app-shell">
    
    <!-- Top Instrument Bar -->
    <header class="top-bar">
      <div class="top-bar-inner">
        <div class="brand-section">
          <a href="/" class="mind-badge" aria-label="Mind Ecosystem (На главную)">
            <span class="mind-badge-glyph">M</span>
          </a>
          <h1 class="node-title">Узел документации и ТО</h1>
        </div>
        
        <div class="node-meta">
          <div class="tls-badge" title="Защищённый автономный TLS-узел (порт 5810)">
            <span class="cyan-dot" aria-hidden="true"></span>
            <span>TLS · 5810</span>
          </div>
        </div>
      </div>
    </header>

    <!-- 404 Main Area -->
    <main class="main-viewport error-404-container">
      <div class="error-404-card">
        <div class="error-404-code">404</div>
        <h2 class="error-404-title">Оборудование или документ не найдены</h2>
        <p class="error-404-desc">
          Запрашиваемая карточка агрегата или файл эксплуатационной документации отсутствуют в локальной базе данных узла. Проверьте правильность QR-кода или выберите оборудование из реестра.
        </p>
        <a href="/" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Вернуться к сканеру QR-кода
        </a>
      </div>
    </main>

  </div>
</body>
</html>
